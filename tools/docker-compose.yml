services:
  https-server:
    build: .
    # Regular bridge network with explicit port publishing -- portable to
    # Docker Desktop on Windows/Mac (which run containers inside a VM, so
    # network_mode: host doesn't work there at all) as well as Linux.
    # Confirmed on Linux that a broadcast UDP packet (255.255.255.255:7000,
    # what the board's Discover_ServerIP() sends -- see app_netxduo.h) does
    # reach the container through a plain published port: Docker's UDP
    # port-forwarding is a real bidirectional relay, not an iptables DNAT
    # rule keyed to a specific destination address, so it isn't picky about
    # the packet's destination being a broadcast address. Not verified on
    # Windows/Mac specifically (an extra VM-boundary hop Docker Desktop adds
    # that isn't present on Linux) -- if discovery doesn't reach the
    # container there, the board falls back on its own after ~30s to
    # whatever fixed IP is hardcoded in HTTP_SERVER_ADDRESS/HOST
    # (app_netxduo.h), so it isn't a hard blocker either way.
    ports:
      - "8443:8443"
      - "7000:7000/udp"
    volumes:
      # Bind-mounted, not baked into the image: server.crt/.key must match
      # exactly whatever's pinned in the board firmware currently being
      # deployed (NetXDuo/App/https_ca_cert.h) -- regenerating them
      # (gen_https_cert.sh) or swapping in a different board's cert pair
      # shouldn't require rebuilding the image.
      - ./certs:/app/certs:ro
    restart: unless-stopped
