services:
  https-server:
    build: .
    # Host networking, not published ports: the board finds this server via
    # a UDP *broadcast* on port 7000 (Discover_ServerIP() in app_netxduo.c,
    # answered by discovery_responder() in http_server.py), and it reads the
    # server's IP from the reply packet's source address. Docker's published-
    # port UDP relay (docker-proxy) delivers the broadcast into the container
    # fine, but cannot send a valid reply back to a broadcast sender -- the
    # board never gets an answer, retries every 2s, and never connects
    # (verified: with published ports the reply never arrives; with host
    # networking it arrives from the host's real IP). With network_mode:
    # host the container shares the host's network stack, so it behaves
    # exactly like running http_server.py directly on the host. No `ports:`
    # mapping is needed (or allowed): 8443/tcp and 7000/udp are the host's own.
    #
    # Linux only -- Docker Desktop on Windows/Mac runs containers in a VM
    # and has no equivalent. There, run http_server.py directly with Python
    # instead (see Doc/INSTALLATION.md), or use docker-compose.bridge.yml
    # (HTTPS dashboard works, but the board's discovery does not).
    network_mode: host
    volumes:
      # Bind-mounted, not baked into the image: server.crt/.key must match
      # exactly whatever's pinned in the board firmware currently being
      # deployed (NetXDuo/App/https_ca_cert.h) -- regenerating them
      # (gen_https_cert.sh) or swapping in a different board's cert pair
      # shouldn't require rebuilding the image.
      - ./certs:/app/certs:ro
    restart: unless-stopped
