<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Sensor Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b36;
    --text: #e6e9ef;
    --text-dim: #8892a4;
    --accent: #4da3ff;
    --ok: #3ecf8e;
    --warn: #e8b339;
    --bad: #e85d5d;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  h1 span { color: var(--text-dim); font-weight: 400; }
  #status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 6px 12px;
    border-radius: 999px;
  }
  #status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bad);
    transition: background 0.3s ease;
    flex: none;
  }
  #status.live .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #status.stale .dot { background: var(--warn); }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px 18px;
    min-height: 108px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: opacity 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    cursor: pointer;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card:active { transform: translateY(0); }
  .card.empty { opacity: 0.45; }
  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .card-title .icon { font-size: 16px; }
  .card-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .metric {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-family: var(--mono);
  }
  .metric .label { color: var(--text-dim); font-size: 12px; }
  .metric .value { font-size: 18px; font-weight: 600; }
  .metric .unit { color: var(--text-dim); font-size: 12px; margin-left: 4px; font-weight: 400; }
  .axis-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    font-family: var(--mono);
  }
  .axis-row .axis {
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    padding: 6px 8px;
    text-align: center;
  }
  .axis-row .axis .k { color: var(--text-dim); font-size: 11px; display: block; }
  .axis-row .axis .v { font-size: 15px; font-weight: 600; }
  .placeholder {
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
  }
  footer {
    margin-top: 28px;
    color: var(--text-dim);
    font-size: 12px;
  }
  footer code {
    font-family: var(--mono);
    background: var(--panel);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  /* Without this, the [hidden] attribute does nothing here: browsers'
   * built-in "[hidden] { display: none }" rule and this class's own
   * "display: flex" above are equal specificity, and normal (non-
   * !important) author styles always beat the user-agent stylesheet at
   * a tie -- so .modal-overlay's own display:flex silently won every
   * time, regardless of the hidden attribute. That left this full-
   * viewport, position:fixed overlay permanently in the layout and
   * intercepting every click on the page (cards included) even while
   * "closed", which is what actually caused the stuck empty grey
   * rectangle: opening never really opened it (a card click landed on
   * this invisible-but-present overlay instead of the card underneath),
   * and closing never really closed it either. A selector specific to
   * *this class with the hidden attribute* outweighs the bare class
   * rule above regardless of cascade origin, so this is the actual fix,
   * not just a more forceful-looking one. */
  .modal-overlay[hidden] { display: none; }
  .modal-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px 24px 16px;
    width: min(760px, 100%);
    max-height: min(560px, 100%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-header .range {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 400;
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .modal-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  #chart-svg-wrap { flex: 1; min-height: 0; }
  #chart-svg-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .chart-legend .item { display: flex; align-items: center; gap: 6px; }
  .chart-legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chart-legend .item .val { color: var(--text); font-weight: 600; }
  .chart-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Board Sensor Dashboard <span id="source"></span></h1>
  <div id="status"><span class="dot"></span><span id="status-text">waiting for first reading…</span></div>
</header>

<div id="grid"><!-- cards injected by renderAll() --></div>

<footer>
  Polling <code>/api/latest</code> every <span id="poll-interval-label"></span>. Click a card for its history.
  Source: <code>Core/Src/sensors.c</code> (<code>Sensors_ReadAllJSON()</code>) via
  <code>App_HTTP_Thread_Entry</code>'s HTTPS POST to <code>/sensors</code>.
</footer>

<div id="chart-modal" class="modal-overlay" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2><span id="chart-icon"></span><span id="chart-title"></span>
        <span class="range" id="chart-range"></span></h2>
      <button class="modal-close" id="chart-close" aria-label="Close">&times;</button>
    </div>
    <div id="chart-svg-wrap"></div>
    <div class="chart-legend" id="chart-legend"></div>
  </div>
</div>

<script>
const POLL_MS = 500;
document.getElementById("poll-interval-label").textContent = (POLL_MS / 1000) + "s";

// One entry per sensor category the board can send (Sensors_Endpoints[] /
// Sensors_ReadAllJSON() in Core/Src/sensors.c). `render` turns that
// category's JSON value into the card body's inner HTML; an unlisted key
// in a reading just gets a generic key=value card via renderGeneric,
// same fallback spirit as CATEGORY_FORMATTERS on the Python side.
// `series` describes what the chart view (click the card) plots: each
// entry is a field of that category's value object, paired with a label
// and a line color. A category with no `series` (ranging -- its value is
// an array, not scalar fields) still opens the chart modal, just showing
// a "nothing to plot" message instead of a graph.
const CARDS = [
  { key: "temperature",   icon: "🌡️", title: "Temperature", unit: "°C", render: renderTemperature,
    series: [ { field: "hts221_c",   label: "HTS221",  color: "#4da3ff" },
              { field: "lps22hh_c",  label: "LPS22HH", color: "#e8b339" } ] },
  { key: "humidity",      icon: "💧", title: "Humidity", unit: "%RH", render: renderHumidity,
    series: [ { field: "hts221_rh",  label: "HTS221",  color: "#4da3ff" } ] },
  { key: "pressure",      icon: "🌀", title: "Pressure", unit: "hPa", render: renderPressure,
    series: [ { field: "lps22hh_hpa", label: "LPS22HH", color: "#4da3ff" } ] },
  { key: "accelerometer", icon: "📈", title: "Accelerometer", unit: "mg", render: renderAxes("mg"),
    series: axisSeries() },
  { key: "gyroscope",     icon: "🔄", title: "Gyroscope", unit: "mdps", render: renderAxes("mdps"),
    series: axisSeries() },
  { key: "magnetometer",  icon: "🧭", title: "Magnetometer", unit: "mgauss", render: renderAxes("mgauss"),
    series: axisSeries() },
  { key: "light",         icon: "💡", title: "Light", unit: "raw", render: renderLight,
    series: [ { field: "als_raw",   label: "ALS",   color: "#4da3ff" },
              { field: "white_raw", label: "White", color: "#e8b339" } ] },
  { key: "ranging",       icon: "📏", title: "Ranging", unit: "mm", render: renderRanging,
    series: [] },
];

function axisSeries() {
  return [ { field: "x", label: "X", color: "#4da3ff" },
           { field: "y", label: "Y", color: "#e8b339" },
           { field: "z", label: "Z", color: "#3ecf8e" } ];
}

function metric(label, value, unit) {
  return `<div class="metric"><span class="label">${label}</span>` +
         `<span class="value">${value}<span class="unit">${unit || ""}</span></span></div>`;
}

function renderTemperature(v) {
  let out = "";
  if (v.hts221_c !== undefined) out += metric("HTS221", v.hts221_c, "°C");
  if (v.lps22hh_c !== undefined) out += metric("LPS22HH", v.lps22hh_c, "°C");
  return out || renderGenericBody(v);
}
function renderHumidity(v) {
  return v.hts221_rh !== undefined ? metric("HTS221", v.hts221_rh, "%RH") : renderGenericBody(v);
}
function renderPressure(v) {
  return v.lps22hh_hpa !== undefined ? metric("LPS22HH", v.lps22hh_hpa, "hPa") : renderGenericBody(v);
}
function renderAxes(unit) {
  return function (v) {
    if (v.x === undefined) return renderGenericBody(v);
    return `<div class="axis-row">` +
      `<div class="axis"><span class="k">X</span><span class="v">${v.x}</span></div>` +
      `<div class="axis"><span class="k">Y</span><span class="v">${v.y}</span></div>` +
      `<div class="axis"><span class="k">Z</span><span class="v">${v.z}</span></div>` +
      `</div><div class="metric"><span class="label"></span><span class="unit">${unit}</span></div>`;
  };
}
function renderLight(v) {
  if (v.als_raw === undefined) return renderGenericBody(v);
  return metric("ALS", v.als_raw, "raw") + metric("White", v.white_raw, "raw");
}
function renderRanging(v) {
  const zones = v.zones;
  if (!Array.isArray(zones)) return renderGenericBody(v);
  return metric("Zones", zones.length, "") +
    `<div class="placeholder">${zones.join(", ")} mm</div>`;
}
function renderGenericBody(v) {
  if (v === null || v === undefined) return "";
  if (typeof v !== "object") return metric("value", v, "");
  return Object.entries(v).map(([k, val]) => metric(k, val, "")).join("");
}

function cardHTML(def, value) {
  const empty = value === undefined;
  const body = empty
    ? `<div class="placeholder">no data this round</div>`
    : def.render(value);
  return `<div class="card ${empty ? "empty" : ""}" data-key="${def.key}">` +
         `<div class="card-title"><span class="icon">${def.icon}</span>${def.title}</div>` +
         `<div class="card-body">${body}</div></div>`;
}

function renderAll(reading) {
  const grid = document.getElementById("grid");
  const known = new Set(CARDS.map(c => c.key));
  let html = CARDS.map(def => cardHTML(def, reading ? reading[def.key] : undefined)).join("");
  // Any category the board sends that we don't have a dedicated card for
  // yet still shows up, generically, rather than being silently dropped.
  if (reading) {
    for (const key of Object.keys(reading)) {
      if (known.has(key)) continue;
      html += `<div class="card" data-key="${key}"><div class="card-title"><span class="icon">❔</span>${key}</div>` +
              `<div class="card-body">${renderGenericBody(reading[key])}</div></div>`;
    }
  }
  grid.innerHTML = html;
}

let lastUpdatedAt = null;
let lastSource = null;
let lastReading = null;   // last reading object seen, for building a
                          // synthetic chart series if an unknown category
                          // (not in CARDS) is clicked -- see openChart().

function updateStatus(source) {
  const el = document.getElementById("status");
  const text = document.getElementById("status-text");
  const sourceEl = document.getElementById("source");
  sourceEl.textContent = source ? "— " + source : "";
  if (lastUpdatedAt === null) {
    el.className = "";
    text.textContent = "waiting for first reading…";
    return;
  }
  const ageMs = Date.now() - lastUpdatedAt;
  const ageS = (ageMs / 1000).toFixed(1);
  if (ageMs < 3000) {
    el.className = "live";
    text.textContent = `live — updated ${ageS}s ago`;
  } else if (ageMs < 15000) {
    el.className = "stale";
    text.textContent = `stale — last update ${ageS}s ago`;
  } else {
    el.className = "";
    text.textContent = `no data for ${ageS}s — is the board still running?`;
  }
}

async function poll() {
  try {
    const res = await fetch("/api/latest", { cache: "no-store" });
    const data = await res.json();
    if (data.updated_at_ms) {
      lastUpdatedAt = data.updated_at_ms;
      lastReading = data.reading;
      renderAll(data.reading);
    }
    lastSource = data.source || null;
    updateStatus(lastSource);
  } catch (e) {
    // Transient fetch failure (e.g. page loaded before the server was
    // ready) -- just let the next poll try again.
  }
}

// ---- Card click -> history chart modal --------------------------------
//
// Clicking any card opens a modal with a live-updating line chart of that
// category's recent history (GET /api/history?category=<key>, polled
// only while the modal is open). One event listener on #grid (rather than
// one per card) so newly-rendered cards from renderAll()'s innerHTML
// swap-out are automatically clickable too, with no re-binding needed.

const CHART_POLL_MS = 1000;
// Matches the server's HISTORY_WINDOW_SECONDS (tools/http_server.py) --
// only used for the "last N min" label here, not to bound anything
// client-side (the server is the one deciding what history exists).
const HISTORY_WINDOW_SECONDS_HINT = 600;

let chartCategory = null;  // key currently open in the modal, or null
let chartTimer = null;

document.getElementById("grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) openChart(card.dataset.key);
});
document.getElementById("chart-close").addEventListener("click", closeChart);
document.getElementById("chart-modal").addEventListener("click", (e) => {
  if (e.target.id === "chart-modal") closeChart();  // click on the backdrop, not the panel
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && chartCategory !== null) closeChart();
});

function findCardDef(key) {
  const known = CARDS.find(c => c.key === key);
  if (known) return known;
  // Unknown category (the board is sending something not in CARDS yet) --
  // build a best-effort series list from whatever numeric fields the
  // last reading actually had for it, so a brand-new sensor category
  // still gets *some* chart instead of none.
  const sample = lastReading ? lastReading[key] : null;
  const palette = ["#4da3ff", "#e8b339", "#3ecf8e", "#e85d5d"];
  const series = (sample && typeof sample === "object" && !Array.isArray(sample))
    ? Object.keys(sample).filter(k => typeof sample[k] === "number")
        .map((field, i) => ({ field, label: field, color: palette[i % palette.length] }))
    : [];
  return { key, icon: "❔", title: key, unit: "", series };
}

function openChart(key) {
  const def = findCardDef(key);
  chartCategory = key;
  document.getElementById("chart-icon").textContent = def.icon || "";
  document.getElementById("chart-title").textContent = def.title;
  document.getElementById("chart-range").textContent =
    `last ${Math.round(HISTORY_WINDOW_SECONDS_HINT / 60)} min`;
  document.getElementById("chart-modal").hidden = false;
  pollHistory();
  clearInterval(chartTimer);
  chartTimer = setInterval(pollHistory, CHART_POLL_MS);
}

function closeChart() {
  chartCategory = null;
  document.getElementById("chart-modal").hidden = true;
  clearInterval(chartTimer);
  chartTimer = null;
}

async function pollHistory() {
  if (chartCategory === null) return;
  const key = chartCategory;
  try {
    const res = await fetch(`/api/history?category=${encodeURIComponent(key)}`, { cache: "no-store" });
    const data = await res.json();
    if (chartCategory !== key) return;  // modal was closed/switched mid-fetch
    renderChart(findCardDef(key), data.entries);
  } catch (e) {
    // Leave the last-rendered chart in place; the next tick tries again.
  }
}

// Plain SVG line chart -- no charting library: this page has zero
// external requests by design (works over the board's own hotspot with
// no other network route), and the data here is simple enough (a
// handful of numeric series, a few hundred points) that hand-rolling it
// is less code than wiring up a dependency would be anyway.
function renderChart(def, entries) {
  const wrap = document.getElementById("chart-svg-wrap");
  const legend = document.getElementById("chart-legend");

  if (!def.series.length) {
    wrap.innerHTML = `<div class="chart-empty">Nothing to plot for "${def.title}" — ` +
      `this category's value isn't simple numeric fields.</div>`;
    legend.innerHTML = "";
    return;
  }
  if (entries.length < 2) {
    wrap.innerHTML = `<div class="chart-empty">Not enough data yet — ` +
      `${entries.length === 0 ? "no readings" : "only one reading"} in the last ` +
      `${Math.round(HISTORY_WINDOW_SECONDS_HINT / 60)} minutes.</div>`;
    legend.innerHTML = "";
    return;
  }

  const W = 700, H = 320, padL = 46, padR = 12, padT = 12, padB = 12;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const tMin = entries[0].t, tMax = entries[entries.length - 1].t;
  const tSpan = Math.max(tMax - tMin, 1);

  let vMin = Infinity, vMax = -Infinity;
  for (const e of entries) {
    for (const s of def.series) {
      const val = e.v ? e.v[s.field] : undefined;
      if (typeof val === "number") { if (val < vMin) vMin = val; if (val > vMax) vMax = val; }
    }
  }
  if (!isFinite(vMin) || !isFinite(vMax)) {
    wrap.innerHTML = `<div class="chart-empty">No numeric values found for "${def.title}" in this window.</div>`;
    legend.innerHTML = "";
    return;
  }
  if (vMin === vMax) { vMin -= 1; vMax += 1; }  // flat line -- still give it visible headroom
  const vPad = (vMax - vMin) * 0.1;
  vMin -= vPad; vMax += vPad;

  const x = (t) => padL + ((t - tMin) / tSpan) * plotW;
  const y = (v) => padT + plotH - ((v - vMin) / (vMax - vMin)) * plotH;

  const GRID_LINES = 4;
  let gridSvg = "";
  for (let i = 0; i <= GRID_LINES; i++) {
    const val = vMin + (vMax - vMin) * (i / GRID_LINES);
    const yy = y(val);
    gridSvg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="#262b36" stroke-width="1"/>`;
    gridSvg += `<text x="${padL - 8}" y="${yy.toFixed(1)}" fill="#8892a4" font-size="11" ` +
               `text-anchor="end" dominant-baseline="middle">${formatAxisValue(val)}</text>`;
  }

  let linesSvg = "";
  for (const s of def.series) {
    const pts = [];
    for (const e of entries) {
      const val = e.v ? e.v[s.field] : undefined;
      if (typeof val === "number") pts.push(`${x(e.t).toFixed(1)},${y(val).toFixed(1)}`);
    }
    if (pts.length) {
      linesSvg += `<polyline points="${pts.join(" ")}" fill="none" stroke="${s.color}" ` +
                  `stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  }

  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${gridSvg}${linesSvg}</svg>`;

  const last = entries[entries.length - 1];
  legend.innerHTML = def.series.map(s => {
    const val = last.v ? last.v[s.field] : undefined;
    return `<div class="item"><span class="swatch" style="background:${s.color}"></span>` +
           `${s.label}: <span class="val">${typeof val === "number" ? val : "—"}</span>` +
           `${def.unit ? " " + def.unit : ""}</div>`;
  }).join("");
}

function formatAxisValue(v) {
  // Trim to a sane number of decimals for axis labels without mangling
  // integers (accel/gyro/mag axes) into "998.00".
  return Number.isInteger(v) ? String(v) : v.toFixed(2);
}

renderAll(null);
updateStatus(null);
poll();
setInterval(poll, POLL_MS);
// Ticks the "Xs ago" text between polls too, so it counts up smoothly
// instead of only updating every POLL_MS.
setInterval(() => updateStatus(lastSource), 500);
</script>

</body>
</html>
